<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Static PlayReal prototype for uploading challenge evidence.">
    <title>PlayReal - Upload Evidence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class" };
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <header class="border-b border-blue-800 bg-blue-700 text-white dark:border-slate-700 dark:bg-slate-900"><div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8"><a href="index.html" class="text-xl font-bold">PlayReal</a><nav aria-label="Prototype navigation" class="flex flex-wrap gap-3 text-sm font-medium"><a href="index.html" class="hover:text-blue-100">Home</a><a href="group.html" class="hover:text-blue-100">Group</a><a href="upload-evidence.html" aria-current="page" class="underline">Evidence</a><a href="voting.html" class="hover:text-blue-100">Voting</a><a href="ranking.html" class="hover:text-blue-100">Ranking</a><a href="about.html" class="hover:text-blue-100">Team</a></nav><button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" class="rounded-md border border-blue-300 bg-blue-600 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-500 dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700"><span id="theme-label">Dark mode</span></button></div></header>
    <main>
        <section class="px-4 py-12 sm:px-6 lg:px-8"><div class="mx-auto max-w-3xl">
            <p class="text-sm font-semibold uppercase tracking-wider text-blue-700 dark:text-blue-300">Evidence Submission</p>
            <h1 class="mt-2 text-4xl font-bold">Share your challenge progress</h1>
            <p class="mt-4 text-slate-600 dark:text-slate-300">Submit a photo and a short explanation for the active reading challenge.</p>
            <form class="mt-8 rounded-xl border border-blue-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
                <fieldset><legend class="text-xl font-semibold">Your evidence</legend>
                    <div class="mt-5"><label for="evidence-file" class="block font-medium">Photo evidence</label><input id="evidence-file" name="evidence-file" type="file" accept="image/*" class="mt-2 block w-full rounded-md border border-slate-300 p-3 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"></div>
                    <div class="mt-5"><label for="evidence-comment" class="block font-medium">Comment</label><textarea id="evidence-comment" name="evidence-comment" rows="5" placeholder="Tell the group how you completed the challenge." class="mt-2 w-full rounded-md border border-slate-300 p-3 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"></textarea></div>
                    <div class="mt-6 flex flex-wrap gap-3"><button type="button" class="rounded-md bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-500">Submit evidence</button><a href="group.html" class="rounded-md border border-blue-300 px-5 py-3 font-semibold text-blue-700 hover:bg-blue-50 dark:border-slate-600 dark:text-blue-300 dark:hover:bg-slate-800">Back to group</a></div>
                </fieldset>
            </form>
        </div></section>
    </main>
    <footer class="bg-blue-800 px-4 py-6 text-center text-sm text-blue-100 dark:bg-slate-950"><p>PlayReal static prototype</p></footer>
    <script src="js/theme.js"></script>
</body>
</html>
